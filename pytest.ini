[pytest]
# pytest configuration for ADgents

testpaths = tests core
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

norecursedirs = .git .github build dist .egg-info __pycache__

# Minimum Python version
minversion = 6.0
